<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 64" width="760" height="64" role="img" aria-label="Aspiring Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="txt" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"   stop-color="#7dd3fc"/>
    <stop offset="50%"  stop-color="#c4b5fd"/>
    <stop offset="100%" stop-color="#7dd3fc"/>
  </linearGradient>
  <linearGradient id="sheen2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <mask id="m1">
    <rect width="760" height="64" fill="black"/>
    <text x="380" y="41" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="1.5" fill="white">Aspiring Full Stack Developer</text>
  </mask>
  <mask id="m2">
    <rect width="760" height="64" fill="black"/>
    <text x="380" y="41" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="1.5" fill="white">Next.js  ·  React  ·  Node.js</text>
  </mask>
  <mask id="m3">
    <rect width="760" height="64" fill="black"/>
    <text x="380" y="41" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="1.5" fill="white">Autodidata construindo em público</text>
  </mask>
  <mask id="m4">
    <rect width="760" height="64" fill="black"/>
    <text x="380" y="41" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="1.5" fill="white">Código que vai rodar pra cliente real</text>
  </mask>
  <style>
    .line { animation: show 16s linear infinite; }
    .hid  { opacity: 0; }
    @keyframes show {
      0%    { opacity: 0; }
      2%    { opacity: 1; }
      22%   { opacity: 1; }
      25%   { opacity: 0; }
      100%  { opacity: 0; }
    }
    .glint { animation: glint 16s linear infinite; }
    @keyframes glint {
      0%   { transform: translateX(0); }
      18%  { transform: translateX(1020px); }
      100% { transform: translateX(1020px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .line { animation: none; }
      .glint { animation: none; }
    }
  </style>
</defs>
  <g class="line" style="animation-delay:0s">
    <g mask="url(#m1)">
      <rect width="760" height="64" fill="url(#txt)"/>
      <rect class="glint" x="-260" y="0" width="260" height="64" fill="url(#sheen2)" style="animation-delay:0s"/>
    </g>
  </g>
  <g class="line hid" style="animation-delay:4s">
    <g mask="url(#m2)">
      <rect width="760" height="64" fill="url(#txt)"/>
      <rect class="glint" x="-260" y="0" width="260" height="64" fill="url(#sheen2)" style="animation-delay:4s"/>
    </g>
  </g>
  <g class="line hid" style="animation-delay:8s">
    <g mask="url(#m3)">
      <rect width="760" height="64" fill="url(#txt)"/>
      <rect class="glint" x="-260" y="0" width="260" height="64" fill="url(#sheen2)" style="animation-delay:8s"/>
    </g>
  </g>
  <g class="line hid" style="animation-delay:12s">
    <g mask="url(#m4)">
      <rect width="760" height="64" fill="url(#txt)"/>
      <rect class="glint" x="-260" y="0" width="260" height="64" fill="url(#sheen2)" style="animation-delay:12s"/>
    </g>
  </g>
</svg>
